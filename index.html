<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a5f3fc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>วงล้อสุ่มน่ารัก</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --gr{syntax:'<number>';inherits:true;initial-value:128}
@property --gg{syntax:'<number>';inherits:true;initial-value:0}
@property --gb{syntax:'<number>';inherits:true;initial-value:255}
:root{--gr:128;--gg:0;--gb:255;--glow:var(--gr),var(--gg),var(--gb);transition:--gr .9s,--gg .9s,--gb .9s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Prompt,system-ui,sans-serif;background:linear-gradient(180deg,#bae6fd,#a5f3fc 50%,#5eead4) fixed;min-height:100vh;color:#0c4a6e;touch-action:manipulation;overflow-x:hidden}
.view{max-width:480px;margin:0 auto;padding:14px 18px 40px;min-height:100vh;overflow:hidden}
.view[hidden]{display:none}
.bar,.hd{display:flex;align-items:center;gap:10px}
.bar{justify-content:flex-end}
.hd{margin-bottom:14px;font-size:18px}
.ib{border:0;background:rgba(255,255,255,.65);width:40px;height:40px;border-radius:50%;font-size:19px;color:#0c4a6e}
h1{text-align:center;margin:2px 0 0;font-size:29px;font-weight:600;color:#0369a1;user-select:none;-webkit-user-select:none}
.sub{text-align:center;margin:2px 0 10px;color:#0e7490;font-size:14px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid #7dd3fc;background:#fff;color:#075985;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px}
.chip.on{background:#e0f2fe;border-color:#0ea5e9;font-weight:600}
.box{position:relative;width:min(78vw,350px);aspect-ratio:1;margin:46px auto 40px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.glow{position:absolute;inset:-26%;border-radius:50%;pointer-events:none;background:radial-gradient(circle closest-side,rgba(var(--glow),.85) 0 62%,rgba(var(--glow),.5) 71%,rgba(var(--glow),.2) 85%,rgba(var(--glow),0) 100%)}
canvas{position:relative;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.9);display:block}
.ptr{position:absolute;left:50%;top:-16px;transform:translateX(-50%);border:14px solid transparent;border-top:26px solid #f43f5e;border-bottom:0;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.hub{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:5px solid rgb(var(--glow));display:grid;place-items:center;padding:0;z-index:3}
.dot{width:46%;aspect-ratio:1;border-radius:50%;background:rgb(var(--glow))}
.spin{border:0;color:#fff;font:inherit;font-weight:600;font-size:19px;padding:14px 42px;border-radius:99px;background:linear-gradient(90deg,#0ea5e9,#0d9488);box-shadow:0 8px 18px rgba(13,148,136,.3)}
.spin:disabled{opacity:.6}
.card{margin:22px 0 6px;background:#fff;border:3px solid #7dd3fc;border-radius:20px;padding:20px 14px;text-align:center;color:#6b7280;font-size:16px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:8px}
.row input{flex:1;border:0;font:inherit;font-size:16px;color:#0c4a6e;background:transparent;outline:0;min-width:0}
.d{width:16px;height:16px;border-radius:50%;flex:none}
.x{border:0;background:none;color:#9ca3af;font-size:18px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;font-size:15px}
.rw small{color:#0e7490;font-size:12px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:10px}
.strip i{height:14px;border-radius:4px}
.strip i.cur{outline:2px solid #0c4a6e;outline-offset:1px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:#d1d5db;position:relative;transition:.2s;flex:none;margin:0}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
input[type=checkbox]:checked{background:#0ea5e9}
input[type=checkbox]:checked::after{left:21px}
#pn{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#pn[hidden]{display:none}
#pn>div{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px}
.glow{animation:br 3.8s ease-in-out infinite}
.glow::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent,rgba(255,255,255,.28),transparent 28%,transparent 62%,rgba(255,255,255,.18),transparent);-webkit-mask:radial-gradient(circle closest-side,#000 68%,transparent);mask:radial-gradient(circle closest-side,#000 68%,transparent);animation:sw 10s linear infinite}
.box.spinning .glow{animation-duration:1.4s}
.fx{position:absolute;inset:-26%;border-radius:50%;overflow:hidden;pointer-events:none}
.bub{position:absolute;bottom:2%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.25);animation:up linear infinite}
.rp{position:absolute;left:50%;top:50%;width:68%;aspect-ratio:1;border:3px solid rgba(255,255,255,.75);border-radius:50%;animation:rip 3.3s ease-out infinite}
.lk{position:absolute;transform:translate(-50%,-50%);font-size:15px;font-style:normal;z-index:4;pointer-events:none;opacity:.85}
.stat{margin:12px 0;background:rgba(255,255,255,.8);border-radius:16px;padding:12px 14px;font-size:14px}
.sr{display:flex;align-items:center;gap:8px;margin-top:6px}
.sr>span:first-child{width:38%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sb{flex:1;height:8px;border-radius:9px;background:#e0f2fe;overflow:hidden}
.sb u{display:block;height:100%;background:#0ea5e9;border-radius:9px}
.sr em{width:24px;text-align:right;font-style:normal}
@keyframes br{0%,100%{transform:scale(.96);opacity:.85}50%{transform:scale(1.05);opacity:1}}
@keyframes sw{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(0);opacity:.9}to{transform:translateY(-330px);opacity:0}}
@keyframes rip{from{transform:translate(-50%,-50%) scale(.9);opacity:.8}to{transform:translate(-50%,-50%) scale(2);opacity:0}}
@media(prefers-reduced-motion:reduce){.glow,.glow::after,.bub,.rp{animation:none}}
.ptr.wg{animation:wg .45s;transform-origin:50% 0}
@keyframes wg{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-14deg)}75%{transform:translateX(-50%) rotate(14deg)}}
.sea{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.view{position:relative;z-index:1}
.fs{position:absolute;left:0;font-size:26px;opacity:.75;animation:sw1 24s linear infinite}
.fs.r{animation-name:sw2}
.jf{position:absolute;font-size:26px;opacity:.7;animation:jf 6s ease-in-out infinite}
.wv{position:absolute;left:0;bottom:0;width:200%;height:60px;animation:wv 9s linear infinite}
.shine{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;background:conic-gradient(transparent,rgba(255,255,255,.35) 8%,transparent 18%,transparent 50%,rgba(255,255,255,.2) 58%,transparent 68%);animation:sw 7s linear infinite}
.box.spinning .shine{animation-duration:1.6s}
@keyframes sw1{from{transform:translateX(-12vw) scaleX(-1)}to{transform:translateX(112vw) scaleX(-1)}}
@keyframes sw2{from{transform:translateX(112vw)}to{transform:translateX(-12vw)}}
@keyframes jf{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes wv{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.fs,.jf,.wv,.shine{animation:none}}
</style>
</head>
<body>
<div class="sea" aria-hidden="true"><span class="fs" style="top:10%;animation-duration:22s">🐠</span><span class="fs r" style="top:33%;animation-duration:30s;animation-delay:-9s">🐟</span><span class="fs" style="top:64%;animation-duration:27s;animation-delay:-16s">🐡</span><span class="fs r" style="top:82%;animation-duration:34s;animation-delay:-4s">🐢</span><span class="jf" style="left:7%;top:46%">🪼</span><span class="jf" style="left:86%;top:20%;animation-delay:-3s">🪼</span><svg class="wv" viewBox="0 0 2400 80" preserveAspectRatio="none"><path d="M0 40Q150 0 300 40T600 40T900 40T1200 40T1500 40T1800 40T2100 40T2400 40V80H0Z" fill="rgba(255,255,255,.5)"/></svg></div>
<main id="v-main" class="view">
<div class="bar"><button class="ib" onclick="show('edit')" aria-label="แก้ไขวงล้อ">✏️</button><button class="ib" onclick="show('set')" aria-label="ตั้งค่า">⚙️</button></div>
<h1 id="title">🌊 วงล้อสุ่มน่ารัก</h1>
<p class="sub">หมุนวงล้อและรอผลลัพธ์ที่น่าตื่นเต้น!</p>
<div class="chips" id="modes"><button class="chip" data-m="0">สุ่มปกติ</button><button class="chip" data-m="1">ตัดออกเมื่อถูกสุ่ม</button></div>
<div class="box" id="box"><div class="glow"></div><div class="fx" id="fx"></div><canvas id="wheel" width="640" height="640"></canvas><div class="shine"></div><div class="ptr"></div><button class="hub" id="hub" aria-label="เปลี่ยนสีไฟ"><span class="dot" id="dot"></span></button></div>
<div style="text-align:center"><button class="spin" id="spin">🎲 หมุนวงล้อ!</button></div>
<div class="card" id="res">กดปุ่มหมุนเพื่อเริ่มเกม 🎉</div>

<div class="stat" id="stat"></div>
</main>

<section id="v-edit" class="view" hidden>
<div class="hd"><button class="ib" onclick="back()" aria-label="กลับ">←</button><b>แก้ไขวงล้อ</b></div>
<div class="chips" id="tpl" style="justify-content:flex-start"></div>
<div id="list"></div>
<button class="chip" id="add">＋ เพิ่มตัวเลือก</button>
</section>

<section id="v-set" class="view" hidden>
<div class="hd"><button class="ib" onclick="show('main')" aria-label="กลับ">←</button><b>ตั้งค่า</b></div>
<div class="rw" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><span>สีไฟหลังวงล้อ</span><small>เปลี่ยนอัตโนมัติ ทุก 3 วิ</small></div><div id="strip" class="strip"></div></div>
<label class="rw">ไฟเปลี่ยนสีอัตโนมัติ<input type="checkbox" id="tAuto"></label>
<label class="rw">เสียง<input type="checkbox" id="sndT"></label>
<label class="rw">การสั่น<input type="checkbox" id="vibT"></label>
<label class="rw">แสดงสถิติการออก<input type="checkbox" id="tStat"></label>
<label class="rw">แสดงช่องผลลัพธ์<input type="checkbox" id="tRes"></label>
<div class="rw"><span>ล้างสถิติการออก</span><button class="chip" id="clr">ล้าง</button></div>
<div class="rw"><span>เกี่ยวกับแอป</span><small>วงล้อสุ่มน่ารัก 1.0</small></div>
</section>

<div id="pn" hidden><div><p style="margin:0 0 10px;font-weight:500">ผลรอบถัดไป</p><div class="chips" id="pl" style="justify-content:flex-start"></div></div></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const COL=[[255,0,0],[255,128,0],[255,255,0],[128,255,0],[0,255,0],[0,255,128],[0,255,255],[0,128,255],[0,0,255],[128,0,255],[255,0,255],[255,0,128]];
const PAL=['#0284c7','#06b6d4','#0f766e','#3b82f6','#fb7185','#14b8a6','#1d4ed8','#f59e0b'];
const TPL={'Alcohol':['🍺 เบียร์','🍷 ไวน์','🥃 วิสกี้','🍸 ค็อกเทล','🍹 มาร์การิต้า','💧 น้ำเปล่า'],'กินอะไรดี':['🍜 ก๋วยเตี๋ยว','🍛 ข้าวแกง','🍕 พิซซ่า','🍣 ซูชิ','🍗 ไก่ทอด','🥗 สลัด'],'ใครจ่าย':['เพื่อนคนที่ 1','เพื่อนคนที่ 2','เพื่อนคนที่ 3','เพื่อนคนที่ 4'],'ทำโทษ':['🕺 เต้น 10 วิ','🎤 ร้องเพลง','🥤 เลี้ยงน้ำ','🤪 ทำหน้าตลก','💪 วิดพื้น 5 ที','😇 รอดตัว']};
let all=TPL['Alcohol'].slice(),S={snd:1,vib:1,mode:0,a2:0,stat:1,resb:1},ST={},hist=[],removed=new Set(),act=[],cur=0,busy=0,ci=9,src='tap',L1=null,L2=null,autoT,ht,hx,hy,tp=null,taps=0,lastTap=0;
try{const d=JSON.parse(localStorage.getItem('wv1'));if(d){if(d.all&&d.all.length>1)all=d.all;Object.assign(S,d.S);hist=d.hist||[];ST=d.ST||{}}}catch(e){}
const save=()=>{try{localStorage.setItem('wv1',JSON.stringify({all,S,hist,ST}))}catch(e){}};
const buzz=p=>{if(S.vib&&navigator.vibrate)navigator.vibrate(p)};
const rgb=()=>ci%4===0;
const cv=$('#wheel'),ctx=cv.getContext('2d'),box=$('#box'),W=640;

function draw(){const n=act.length,s=2*Math.PI/n,c=W/2;ctx.clearRect(0,0,W,W);
act.forEach((ai,k)=>{ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,c-4,-Math.PI/2+k*s,-Math.PI/2+(k+1)*s);ctx.closePath();ctx.fillStyle=PAL[ai%8];ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
ctx.save();ctx.translate(c,c);ctx.rotate(-Math.PI/2+(k+.5)*s);ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=4;ctx.font='600 '+Math.max(20,36-n*1.6)+'px Prompt,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(all[ai],c-36,0,c*.62);ctx.restore()});ctx.fillStyle='rgba(255,255,255,.92)';for(let i=0;i<32;i++){const a=i*Math.PI/16;ctx.beginPath();ctx.arc(c+Math.cos(a)*(c-12),c+Math.sin(a)*(c-12),11,0,7);ctx.fill()}}
function rebuild(){act=all.map((_,i)=>i).filter(i=>!removed.has(i));cur=0;cv.style.transition='none';cv.style.transform='rotate(0deg)';draw()}
function glow(){{const st=document.documentElement.style,c=COL[ci];st.setProperty('--gr',c[0]);st.setProperty('--gg',c[1]);st.setProperty('--gb',c[2])}document.querySelectorAll('#strip i').forEach((e,k)=>e.classList.toggle('cur',k===ci))}
function mark(ai){const k=act.indexOf(ai);if(k<0)return;const a=((k+.5)*360/act.length+cur)*Math.PI/180,m=document.createElement('i');m.className='lk';m.textContent='🔒';m.style.left=50+40*Math.sin(a)+'%';m.style.top=50-40*Math.cos(a)+'%';box.appendChild(m);setTimeout(()=>m.remove(),2000)}
function lockHold(ai){L2=ai;buzz([30,60,30]);const p=$('.ptr');p.classList.remove('wg');void p.offsetWidth;p.classList.add('wg')}
function auto(on){clearInterval(autoT);if(on)autoT=setInterval(()=>{ci=(ci+1)%12;src='auto';glow()},3000)}
function show(v){['main','edit','set'].forEach(x=>$('#v-'+x).hidden=x!==v);if(v==='edit')re();scrollTo(0,0)}
const free=()=>{busy=0;$('#spin').disabled=false};
const rh=()=>{};
const snd=new Audio('spinner-sound.mp3');snd.preload='auto';snd.volume=.8;
function fade(){let v=.8;const t=setInterval(()=>{v-=.12;if(v<=0){clearInterval(t);snd.pause();snd.volume=.8}else snd.volume=v},70)}
function fx(on){const f=$('#fx');f.innerHTML='';box.classList.toggle('spinning',!!on);if(!on)return;let h='';for(let i=0;i<3;i++)h+='<i class="rp" style="animation-delay:'+i*1.1+'s"></i>';for(let i=0;i<16;i++)h+='<b class="bub" style="left:'+Math.random()*100+'%;width:'+(6+Math.random()*10)+'px;animation-duration:'+(2+Math.random()*2.5)+'s;animation-delay:'+Math.random()*2+'s"></b>';f.innerHTML=h}

function spin(){if(busy||!act.length)return;busy=1;$('#spin').disabled=true;$('#res').textContent='กำลังหมุน...';fx(1);if(S.snd){snd.currentTime=0;snd.volume=.8;snd.play().catch(()=>{})}
let k=Math.floor(Math.random()*act.length);
if(src==='auto'||rgb()){const f=src==='tap'?(L1?L1.slot:null):L2;if(f!=null){const j=act.indexOf(f);if(j>=0)k=j;if(src==='tap')L1=null;else L2=null}}
const s=360/act.length,th=k*s+s*(.14+Math.random()*.72);
cur=Math.ceil(cur/360)*360+360*(5+Math.floor(Math.random()*3))+360-th;
cv.style.transition='transform 5s cubic-bezier(.12,.62,.08,1)';cv.style.transform='rotate('+cur+'deg)';
setTimeout(()=>done(k),5100)}
function done(k){const ai=act[k],n=all[ai];$('#res').textContent='🎉 ผลลัพธ์: '+n;hist.unshift(n);hist=hist.slice(0,8);ST[n]=(ST[n]||0)+1;rh();rs();save();buzz(40);fx(0);fade();
if(S.mode){setTimeout(()=>{removed.add(ai);if(all.length-removed.size<2){removed.clear();$('#res').textContent='ครบทุกช่องแล้ว นำกลับมาใหม่ทั้งหมด'}rebuild();free()},1500)}else free()}
$('#spin').onclick=spin;

$('#hub').onclick=()=>{if(S.a2)return;ci=(ci+1)%12;glow();buzz(rgb()?[15,60,15]:10)};

box.addEventListener('contextmenu',e=>e.preventDefault());
box.addEventListener('pointerdown',e=>{if(busy||!S.a2||!rgb())return;const r=box.getBoundingClientRect(),R=r.width/2,dx=e.clientX-r.left-R,dy=e.clientY-r.top-R,d=Math.hypot(dx,dy);if(d<R*.2||d>R)return;
hx=e.clientX;hy=e.clientY;const ph=(Math.atan2(dx,-dy)*180/Math.PI+360)%360,th=((ph-cur)%360+360)%360,k=Math.floor(th/(360/act.length));
auto(1);const t=Date.now();tp=(tp&&tp.k===k&&t-tp.t<600)?{k,n:tp.n+1,t}:{k,n:1,t};if(tp.n>=3){tp=null;lockHold(act[k])}});
box.addEventListener('pointermove',e=>{if(ht&&Math.hypot(e.clientX-hx,e.clientY-hy)>14){clearTimeout(ht);ht=0}});
['pointerup','pointercancel','pointerleave'].forEach(t=>box.addEventListener(t,()=>{clearTimeout(ht);ht=0}));

$('#title').onclick=()=>{const t=Date.now();taps=t-lastTap<1500?taps+1:1;lastTap=t;if(taps>=10){taps=0;if(!S.a2&&!busy)panel()}};
function panel(){$('#pl').innerHTML=act.map(i=>'<button class="chip" data-p="'+i+'">'+esc(all[i])+'</button>').join('')+'<button class="chip" data-p="-1">ปกติ</button>';$('#pn').hidden=false}
$('#pl').onclick=e=>{const v=e.target.dataset.p;if(v==null)return;$('#pn').hidden=true;if(+v<0){if(L1&&L1.by==='panel')L1=null}else{L1={by:'panel',slot:+v};mark(+v)}};
$('#pn').onclick=e=>{if(e.target.id==='pn')e.currentTarget.hidden=true};

function re(){$('#list').innerHTML=all.map((n,i)=>'<div class="row"><i class="d" style="background:'+PAL[i%8]+'"></i><input value="'+esc(n)+'" data-i="'+i+'" maxlength="18"><button class="x" data-d="'+i+'" aria-label="ลบ">✕</button></div>').join('')}
$('#list').oninput=e=>{if(e.target.dataset.i!=null)all[+e.target.dataset.i]=e.target.value};
$('#list').onclick=e=>{const d=e.target.dataset.d;if(d!=null&&all.length>2){all.splice(+d,1);re()}};
$('#add').onclick=()=>{if(all.length<16){all.push('ตัวเลือกใหม่');re()}};
$('#tpl').innerHTML=Object.keys(TPL).map(k=>'<button class="chip" data-t="'+k+'">'+k+'</button>').join('');
$('#tpl').onclick=e=>{const t=e.target.dataset.t;if(t){all=TPL[t].slice();re()}};
function back(){all=all.map(s=>s.trim()).filter(Boolean);if(all.length<2)all=TPL['Alcohol'].slice();removed.clear();L1=L2=null;save();rebuild();show('main')}

function rm(){document.querySelectorAll('#modes .chip').forEach(b=>b.classList.toggle('on',+b.dataset.m===S.mode))}
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(m==null||busy)return;S.mode=+m;removed.clear();rm();save();rebuild()};
$('#sndT').checked=!!S.snd;$('#vibT').checked=!!S.vib;
$('#sndT').onchange=e=>{S.snd=+e.target.checked;save()};
$('#vibT').onchange=e=>{S.vib=+e.target.checked;save()};
$('#strip').innerHTML=COL.map(c=>'<i style="background:rgb('+c+')"></i>').join('');
